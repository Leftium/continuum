name: Continuum

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check retained 0.3 workflow and canonical 0.4 source/client
        run: bash scripts/check-continuum.sh
